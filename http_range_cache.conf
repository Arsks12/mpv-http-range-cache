# Configuration for mpv-http-range-cache
# Place this file in your mpv `script-opts` directory as `http_range_cache.conf`.

# Enable or disable persistent HTTP range caching on startup (yes/no)
enabled=yes

# Directory where per-stream cache subfolders, server.json, and proxy.lock are saved.
# Supports mpv path prefixes such as `~~/cache/http-range-cache` or absolute paths like `D:/mpv-cache`.
cache_dir=~~/cache/http-range-cache

# Seconds of zero active requests before the background proxy shuts down automatically (0 = never exit)
idle_timeout=300

# Maximum total cached bytes on disk in megabytes before oldest-accessed entries are LRU-evicted (0 = unlimited)
max_cache_size_mb=0

# Streaming buffer size in bytes for disk reads/writes
chunk_size=65536

# Parallel upstream HTTP connections per large uncached span (1 = single connection, 4 = 4x sliding-window range download)
connections=4

# Slice size in KB for each parallel HTTP Range part (minimum 256 KB; 2048 = 2 MiB parts)
part_size_kb=2048

# Flush metadata to cache.meta.json after every N kilobytes written (always flushed when a request ends)
flush_interval_kb=1024

# Comma-separated query parameters stripped before hashing URL cache keys (example: token,sig,expires)
ignore_query_params=

# Match identical files across completely different URLs using total_size + SHA-256 of the first 64 KB (yes/no)
match_by_content=yes

# Python binary to spawn proxy.py (`auto` checks pythonw/python/python3 with `aiohttp` installed)
python_path=auto

# Show OSD notifications for cache hit % on file load, cross-URL resume, and manual commands (yes/no)
show_osd=yes

# Write proxy debug logs to <cache_dir>/proxy.log (yes/no)
debug_log=no

